{% extends "travel/base.html" %}
{% block body %}
<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Delete Place</h5>
      <p class="card-text">
        Are you sure you want to delete <strong>{{ object.place_name }}</strong>?
      </p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'travel:detail' object.pk %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
