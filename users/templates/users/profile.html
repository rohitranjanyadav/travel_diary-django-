{% load static %}

{% block body %}
<div class="container mt-4 mt-md-5">
    <div class="row profile-container">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6">
            <!-- Profile Header Card -->
            <div class="card profile-card shadow mb-4">
                <div class="card-body text-center py-4 py-md-5">
                    <!-- Profile Image -->
                    <img src="{% if profile.image %}{{ profile.image.url }}{% else %}{% static 'users/profile-default.png' %}{% endif %}" 
                         alt="Profile Picture" 
                         class="rounded-circle mb-3" 
                         width="120"
                         height="120"
                         style="object-fit: cover; border: 4px solid #007bff;">
                    
                    <!-- User Info -->
                    <h2 class="card-title mb-2 fw-bold">{{ user.username }}</h2>
                    <p class="text-muted mb-3 small">{{ user.email }}</p>
                    
                    <!-- Location if exists -->
                    {% if profile.location %}
                    <p class="text-secondary small">
                        <i class="fas fa-map-marker-alt"></i> {{ profile.location }}
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
